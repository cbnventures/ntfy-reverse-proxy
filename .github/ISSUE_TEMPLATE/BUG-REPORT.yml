# This file is generated by @cbnventures/nova.
# Do not edit manually.
#
# Run `nova generate github issue-template` to regenerate.
# See: https://nova.cbnventures.io/docs/cli/generators/github/issue-template

name: "Bug Report"
description: "Found an unexpected issue or problem? Report it here."
title: "[Bug]: "
labels: [ "bug" ]
body:
  - type: "markdown"
    attributes:
      value: "We truly appreciate you taking the time to share this bug report with us."
  - type: "markdown"
    attributes:
      value: "Please __fill out the form with as much detail as possible__ so we can recreate the problem."
  - type: "markdown"
    attributes:
      value: "---"
  - type: "checkboxes"
    id: "pre-check"
    attributes:
      label: "Bug Report Confirmation"
      description: "Confirm that this submission belongs in the bug report form."
      options:
        - label: "I have provided a descriptive title and kept the original title prefix, __\"[Bug]: \"__"
          required: true
        - label: "I searched open and closed issues and did not find the same problem"
          required: true
        - label: "I have read the [documentation](https://nrp.cbnventures.io/), and this is __NOT__ a duplicate bug report"
          required: true
        - label: "I am reporting behavior that is not working as documented or intended"
          required: true
  - type: "input"
    id: "email"
    attributes:
      label: "Your email address"
      description: "Help us easily get in touch with you if we need more information. __If possible, please consider using an alias you have access to, as this information is publicly visible.__"
      placeholder: "e.g. user@example.com"
    validations:
      required: true
  - type: "textarea"
    id: "steps-to-reproduce"
    attributes:
      label: "Steps to Reproduce"
      description: "List the shortest sequence that shows the problem. Include setup details that affect the result."
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: "textarea"
    id: "expected-behavior"
    attributes:
      label: "Expected Behavior"
      description: "Describe the result you expected after following those steps."
    validations:
      required: true
  - type: "textarea"
    id: "actual-behavior"
    attributes:
      label: "Actual Behavior"
      description: "Describe what happened instead. Include the exact error text when available."
    validations:
      required: true
  - type: "input"
    id: "affected-version"
    attributes:
      label: "Affected Version or Date"
      description: "Enter the affected version. If no version is visible, enter the date the problem was observed."
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: "dropdown"
    id: "frequency"
    attributes:
      label: "Frequency"
      description: "Select how consistently the problem occurs."
      options:
        - "Every Time"
        - "Often"
        - "Sometimes"
        - "Once"
        - "Not Sure"
    validations:
      required: true
  - type: "input"
    id: "node-version"
    attributes:
      label: "Node.js® Version"
      description: "Enter the complete Node.js® version shown by `node --version`."
      placeholder: "e.g. 24.13.1"
    validations:
      required: true
  - type: "input"
    id: "command"
    attributes:
      label: "Installation or Invocation Command"
      description: "Enter the exact command that installs or invokes the affected package. __Remove all secrets before submitting.__"
    validations:
      required: false
  - type: "textarea"
    id: "minimal-reproduction"
    attributes:
      label: "Minimal Reproduction"
      description: "Provide the smallest code or command sequence that reproduces the problem. __Remove all secrets and private data before submitting.__"
      render: "Shell"
    validations:
      required: false
  - type: "dropdown"
    id: "affected-stage"
    attributes:
      label: "Affected Stage"
      description: "Select the stage most closely related to the submission."
      options:
        - "Configuration"
        - "Validation"
        - "File Generation"
        - "Deployment"
        - "Worker Runtime"
        - "Custom Domain"
        - "Other"
    validations:
      required: true
  - type: "input"
    id: "affected-url"
    attributes:
      label: "Affected URL or Route"
      description: "Enter the affected public URL or route. Use only the route when the hostname is private."
      placeholder: "e.g. /settings"
    validations:
      required: false
  - type: "dropdown"
    id: "browser"
    attributes:
      label: "Browser"
      description: "Select the affected browser."
      options:
        - "Google Chrome"
        - "Mozilla Firefox"
        - "Apple Safari"
        - "Microsoft Edge"
        - "Other"
    validations:
      required: false
  - type: "input"
    id: "browser-version"
    attributes:
      label: "Browser Version"
      description: "Enter the complete browser version."
      placeholder: "e.g. 145.0.7632.75"
    validations:
      required: false
  - type: "input"
    id: "viewport-size"
    attributes:
      label: "Viewport Size"
      description: "Enter the viewport width and height when layout affects the problem."
      placeholder: "e.g. 390 x 844"
    validations:
      required: false
  - type: "textarea"
    id: "screenshots"
    attributes:
      label: "Screenshot"
      description: "Attach a screenshot when it helps show the problem. __Remove personal and confidential information first.__"
    validations:
      required: false
  - type: "dropdown"
    id: "interpreter"
    attributes:
      label: "Interpreter"
      description: "Select the interpreter involved."
      options:
        - "ntfy JSON"
        - "pfSense"
        - "Seerr"
        - "Statuspage.io"
        - "Synology DSM"
        - "UniFi"
        - "Plain Text"
        - "Mailmask"
        - "Outpost"
        - "pfSense Actions"
        - "Transmission VPN"
        - "Stonker Bot for Discord"
        - "Other"
    validations:
      required: true
  - type: "dropdown"
    id: "delivery-mode"
    attributes:
      label: "Delivery Mode"
      description: "Select the configured delivery mode."
      options:
        - "Send Once"
        - "Send All"
        - "Not Sure"
    validations:
      required: false
  - type: "dropdown"
    id: "request-source"
    attributes:
      label: "Request Source"
      description: "Select how the request entered the worker."
      options:
        - "HTTP Webhook"
        - "Email"
        - "Not Sure"
    validations:
      required: false
  - type: "textarea"
    id: "logs"
    attributes:
      label: "Relevant Logs"
      description: "Paste the relevant failure output when available. __Remove all secrets and personal data before submitting.__ This block is formatted as code, so there is no need for backticks."
      render: "Shell"
    validations:
      required: false
  - type: "textarea"
    id: "additional-context"
    attributes:
      label: "Additional Context"
      description: "Add any other information that could help explain the submission."
    validations:
      required: false
  - type: "checkboxes"
    id: "legal"
    attributes:
      label: "Legal Agreements"
      description: "By submitting a new bug report, you confirm that you have read, understood, and agree to the [Terms of Use](https://www.cbnventures.io/terms/) and [Privacy Policy](https://www.cbnventures.io/privacy/). If you have questions, please contact our team."
      options:
        - label: "I agree to the Terms of Use and Privacy Policy"
          required: true
